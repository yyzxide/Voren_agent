name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked runtime and integration dependencies
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install --requirement pylock.toml
          python -m pip install 'setuptools==80.9.0' 'wheel==0.45.1'
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Check browser script syntax and build distribution
        run: |
          node --check src/voren/web/static/app.js
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/voren-wheel .

      - name: Run deterministic unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Replay released answer evidence
        run: python scripts/evaluate_knowledge_answers.py verify docs/evidence/2026-10-08-v1-answers.json
