name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and pinned AgentDojo integration
        run: python -m pip install --upgrade pip && python -m pip install -e '.[agentdojo]'

      - name: Run deterministic unit and integration tests
        run: python -m unittest discover -s tests -v
